<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="card">
    <div class="card__inner">

      <!-- FRONT -->
      <div class="card__face card__face--front">

        <div class="front-inner">
          <img src="logo.png" class="logo" alt="Logo">
        </div>

      </div>


      <!-- BACK -->
      <div class="card__face card__face--back">

        <div class="id-card">

          <h1>
            Perfect 10 Academy
            <span>퍼펙트 10 아카데미</span>
          </h1>

          <div class="pink-line"></div>

          <p class="description">
            This certifies that the person below is a registered student of
            Perfect 10 Academy /
            본 문서는 아래 명시된 사람이 '퍼펙트 10 아카데미'의 등록 학생임을 증명합니다.
          </p>


          <div class="student-section">

            <div class="photo-container">
              <img src="kia.jpg" class="photo" alt="Student photo">
            </div>


            <div class="student-info">

              <div class="info-row">
                <span class="label">Full Name</span>
                <span class="value pink">Ryu Castro Soomin</span>
              </div>

              <div class="info-row">
                <span class="label">Date of Birth</span>
                <span class="value">2007 / 02 / 08</span>
              </div>

              <div class="info-row">
                <span class="label">Department</span>
                <span class="value">IT / 컴퓨팅</span>
              </div>

              <div class="info-row">
                <span class="label">Year Level</span>
                <span class="value">Year 5</span>
              </div>

            </div>

          </div>

        </div>

        <div class="pink-bottom"></div>

      </div>

    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
